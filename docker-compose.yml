services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
      - db_data:/app/sistema_home_care/db
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/sistema-home-care
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/sistema-home-care:/app
      - /app/node_modules
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
